name: Publicar paquetes

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar paquetes
        uses: actions/checkout@v4

      - name: Crear o actualizar release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          files="SylpackTickets_App.zip SylpackTickets_Instalador.zip checksums.txt latest.json"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" $files --clobber
            gh release edit "$TAG" --title "Sylpack Tickets $TAG" --notes-file RELEASE_NOTES.md
          else
            gh release create "$TAG" $files --title "Sylpack Tickets $TAG" --notes-file RELEASE_NOTES.md
          fi

      - name: Resumen
        run: gh release view "$TAG" --json url,tagName,assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
